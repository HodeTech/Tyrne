# Informational measurements, never a required PR/merge check (ADR-0040).
name: Performance report

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
  push:
    branches: [development]
    paths:
      - '.github/workflows/performance.yml'
      - 'tools/perf-harness.sh'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NIGHTLY_PIN: nightly-2026-01-15
  CARGO_TERM_COLOR: always

jobs:
  performance-report:
    name: Weekly boot-to-end report (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Initialize report evidence
        run: |
          PERF_EVIDENCE="$RUNNER_TEMP/performance-evidence"
          echo "PERF_EVIDENCE=$PERF_EVIDENCE" >> "$GITHUB_ENV"
          mkdir -p "$PERF_EVIDENCE"
          date +%s > "$PERF_EVIDENCE/started-seconds"
          {
            echo "source_sha=$(git rev-parse HEAD)"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "started_utc=$(date -u +%FT%TZ)"
            echo "Informational debug measurements; no calibrated regression threshold."
          } > "$PERF_EVIDENCE/metadata.txt"
      - name: Install QEMU and pinned nightly
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm
          qemu-system-aarch64 --version > "$PERF_EVIDENCE/qemu-version.txt"
          rustup toolchain install "$NIGHTLY_PIN" --component llvm-tools-preview --no-self-update
          rustup override set "$NIGHTLY_PIN"
          rustup target add aarch64-unknown-none --toolchain "$NIGHTLY_PIN"
          rustc -Vv > "$PERF_EVIDENCE/rustc-version.txt"
          rustup show active-toolchain > "$PERF_EVIDENCE/toolchain.txt"
      - name: Cache performance build
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-performance-${{ env.NIGHTLY_PIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-performance-${{ env.NIGHTLY_PIN }}-
      - name: Build matching debug userland and kernel
        run: |
          tools/build-userland.sh
          cargo +"$NIGHTLY_PIN" kernel-build
      - name: Collect 20 debug measurements
        run: |
          tools/perf-harness.sh --iterations=20 --report=ci-nightly 2>&1 | tee "$PERF_EVIDENCE/harness.output.log"
          REPORT_PATH="$(sed -n 's/^report written: //p' "$PERF_EVIDENCE/harness.output.log")"
          [[ "$REPORT_PATH" =~ ^docs/analysis/reports/perf-baseline-[0-9]{4}-[0-9]{2}-[0-9]{2}-ci-nightly\.md$ ]]
          cp "$REPORT_PATH" "$PERF_EVIDENCE/"
      - name: Record wall time
        if: always()
        run: |
          if [[ -f "$PERF_EVIDENCE/started-seconds" ]]; then
            echo "finished_utc=$(date -u +%FT%TZ)" >> "$PERF_EVIDENCE/metadata.txt"
            echo "wall_seconds=$(( $(date +%s) - $(cat "$PERF_EVIDENCE/started-seconds") ))" >> "$PERF_EVIDENCE/metadata.txt"
          fi
      - name: Upload report and available failure diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.PERF_EVIDENCE }}
          if-no-files-found: error
          retention-days: 14
