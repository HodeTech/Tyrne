[package]
name = "tyrne-bsp-qemu-virt"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Tyrne BSP for QEMU aarch64 virt machine (primary development target)."
build = "build.rs"

[[bin]]
name = "tyrne-bsp-qemu-virt"
path = "src/main.rs"

[dependencies]
tyrne-hal = { path = "../hal" }
tyrne-kernel = { path = "../kernel" }

# Inherits the workspace `[lints]` table, which sets the deny-heavy posture
# the BSP's `unsafe`-audit discipline relies on — notably
# `clippy::undocumented_unsafe_blocks` and `clippy::missing_safety_doc`
# (deny) per docs/standards/unsafe-policy.md §Tooling. (C7-013)
[lints]
workspace = true
